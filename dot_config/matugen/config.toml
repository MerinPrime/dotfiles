[config.wallpaper]
set = true
command = "awww img --transition-type random --transition-duration 2 --transition-fps 144 --transition-bezier .43,1.19,1,.4 {{ image }}"

[config.custom_colors]
spotify = { color = "#ff0000", blend = true }

k_color0 = { color = "#3B4252", blend = true }
k_color1 = { color = "#BF616A", blend = true }
k_color2 = { color = "#A3BE8C", blend = true }
k_color3 = { color = "#EBCB8B", blend = true }
k_color4 = { color = "#81A1C1", blend = true }
k_color5 = { color = "#B48EAD", blend = true }
k_color6 = { color = "#88C0D0", blend = true }
k_color7 = { color = "#E5E9F0", blend = true }
k_color8 = { color = "#4C566A", blend = true }
k_color9 = { color = "#BF616A", blend = true }
k_color10 = { color = "#A3BE8C", blend = true }
k_color11 = { color = "#EBCB8B", blend = true }
k_color12 = { color = "#81A1C1", blend = true }
k_color13 = { color = "#B48EAD", blend = true }
k_color14 = { color = "#8FBCBB", blend = true }
k_color15 = { color = "#ECEFF4", blend = true }

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/modules/colors.lua'
